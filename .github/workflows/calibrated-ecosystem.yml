name: Calibrated ecosystem rerun

on:
  pull_request:
    paths:
      - "src/run_calibrated_ecosystem.py"
      - "src/run_attention_breakeven.py"
      - "src/run_gate_attention_factorial.py"
      - "src/scientific_publication_simulator.py"
      - "results/empirical_calibration/best_fit_parameters.json"
      - "PREDICTION_ATTENTION_FACTORIAL.md"
      - ".github/workflows/calibrated-ecosystem.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run preregistered gate-attention factorial
        run: |
          python src/run_gate_attention_factorial.py \
            --worlds 300 \
            --sweep-worlds 150 \
            --papers 250 \
            --periods 25 \
            --exploration-step 0.10 \
            --output-dir gate_attention_factorial_output
      - name: Display factorial results
        run: |
          echo "Arm summary"
          cat gate_attention_factorial_output/arm_summary.csv
          echo
          echo "Factorial effects"
          cat gate_attention_factorial_output/factorial_effects.csv
          echo
          echo "Exploration sweep"
          cat gate_attention_factorial_output/exploration_sweep.csv
          echo
          echo "Metadata"
          cat gate_attention_factorial_output/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-attention-factorial-results
          path: gate_attention_factorial_output/
          if-no-files-found: error
