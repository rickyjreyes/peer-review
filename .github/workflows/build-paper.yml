name: Build paper PDF

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-science \
            texlive-pictures \
            texlive-fonts-recommended \
            lmodern

      - name: Compile manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error peer_review_ecosystem_simulation.tex
          pdflatex -interaction=nonstopmode -halt-on-error peer_review_ecosystem_simulation.tex

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/peer_review_ecosystem_simulation.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF is already current."
          else
            git commit -m "Build current paper PDF"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
