<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">True-value recovery across assumption profiles</title>
<desc id="desc">Grouped comparison of realistic and peer-review-favorable assumptions for peer review, open publication, open triage, and hybrid systems.</desc>
<rect width="1100" height="650" fill="white"/>
<text x="550" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">True-value recovery across assumption profiles</text>
<line x1="105" y1="535" x2="1040" y2="535" stroke="#333" stroke-width="2"/>
<line x1="105" y1="90" x2="105" y2="535" stroke="#333" stroke-width="2"/>
<g font-family="Arial, sans-serif" font-size="18" fill="#333"><text x="92" y="541" text-anchor="end">0%</text><text x="92" y="452" text-anchor="end">20%</text><text x="92" y="363" text-anchor="end">40%</text><text x="92" y="274" text-anchor="end">60%</text><text x="92" y="185" text-anchor="end">80%</text><text x="92" y="96" text-anchor="end">100%</text></g>
<g stroke="#ddd"><line x1="105" y1="446" x2="1040" y2="446"/><line x1="105" y1="357" x2="1040" y2="357"/><line x1="105" y1="268" x2="1040" y2="268"/><line x1="105" y1="179" x2="1040" y2="179"/><line x1="105" y1="90" x2="1040" y2="90"/></g>
<g fill="#2b7bb9"><rect x="155" y="214" width="82" height="321"/><rect x="380" y="171" width="82" height="364"/><rect x="605" y="157" width="82" height="378"/><rect x="830" y="160" width="82" height="375"/></g>
<g fill="#8f8f8f"><rect x="241" y="141" width="82" height="394"/><rect x="466" y="192" width="82" height="343"/><rect x="691" y="140" width="82" height="395"/><rect x="916" y="143" width="82" height="392"/></g>
<g font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#111"><text x="196" y="201">72.1%</text><text x="282" y="128">88.6%</text><text x="421" y="158">81.8%</text><text x="507" y="179">77.1%</text><text x="646" y="144">85.0%</text><text x="732" y="127">88.8%</text><text x="871" y="147">84.3%</text><text x="957" y="130">88.1%</text></g>
<g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#222"><text x="239" y="575">Peer review</text><text x="464" y="575">Open publication</text><text x="689" y="575">Open triage</text><text x="914" y="575">Hybrid</text></g>
<rect x="785" y="68" width="18" height="18" fill="#2b7bb9"/><text x="810" y="83" font-family="Arial, sans-serif" font-size="17">Realistic</text><rect x="900" y="68" width="18" height="18" fill="#8f8f8f"/><text x="925" y="83" font-family="Arial, sans-serif" font-size="17">Peer-review-favorable</text>
<text x="30" y="315" transform="rotate(-90 30 315)" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">True scientific value recovered</text>
</svg>
