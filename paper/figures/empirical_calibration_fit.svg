<rect class="t" x="459.3" y="426.9" width="34" height="73.1"/><text x="476.3" y="418.9" text-anchor="middle" font-size="14">0.170</text>
<rect class="b" x="503.3" y="418.1" width="34" height="81.9"/><text x="520.3" y="410.1" text-anchor="middle" font-size="14">0.190</text><text x="498.3" y="532" text-anchor="end" transform="rotate(-32 498.3 532)" font-size="16">Kappa</text>
