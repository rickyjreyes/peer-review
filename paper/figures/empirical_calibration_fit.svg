<rect class="t" x="132.7" y="376.7" width="34" height="123.3"/><text x="149.7" y="368.7" text-anchor="middle" font-size="14">0.287</text>
<rect class="b" x="176.7" y="372.9" width="34" height="127.1"/><text x="193.7" y="364.9" text-anchor="middle" font-size="14">0.295</text><text x="171.7" y="532" text-anchor="end" transform="rotate(-32 171.7 532)" font-size="16">Error detection</text>
<rect class="t" x="296.0" y="353.8" width="34" height="146.2"/><text x="313.0" y="345.8" text-anchor="middle" font-size="14">0.340</text>
