<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Empirical reviewer calibration</title>
<desc id="desc">Grouped bars compare empirical reviewer behavior targets with the best-fitting simulated observables.</desc>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#222}.axis{stroke:#333;stroke-width:2}.grid{stroke:#ddd;stroke-width:1}.t{fill:#4b5563}.b{fill:#9ca3af}</style>
<text x="550" y="38" text-anchor="middle" font-size="28" font-weight="bold">Empirical reviewer calibration</text>
