<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">High-consequence truth-harm tradeoff</title>
<desc id="desc">Open triage and hybrid recover the most true social value with the least false social harm. Peer review recovers the least true value and realizes the most false harm.</desc>
<rect width="1000" height="650" fill="white"/>
<text x="500" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">High-consequence tradeoff</text>
<line x1="110" y1="535" x2="940" y2="535" stroke="#333" stroke-width="2"/>
<line x1="110" y1="90" x2="110" y2="535" stroke="#333" stroke-width="2"/>
<g stroke="#ddd"><line x1="110" y1="427" x2="940" y2="427"/><line x1="110" y1="319" x2="940" y2="319"/><line x1="110" y1="211" x2="940" y2="211"/><line x1="110" y1="103" x2="940" y2="103"/><line x1="317" y1="90" x2="317" y2="535"/><line x1="525" y1="90" x2="525" y2="535"/><line x1="732" y1="90" x2="732" y2="535"/><line x1="940" y1="90" x2="940" y2="535"/></g>
<g font-family="Arial, sans-serif" font-size="18" fill="#333"><text x="97" y="541" text-anchor="end">70%</text><text x="97" y="433" text-anchor="end">75%</text><text x="97" y="325" text-anchor="end">80%</text><text x="97" y="217" text-anchor="end">85%</text><text x="110" y="570" text-anchor="middle">10⁻⁵</text><text x="317" y="570" text-anchor="middle">10⁻⁴</text><text x="525" y="570" text-anchor="middle">10⁻³</text><text x="732" y="570" text-anchor="middle">10⁻²</text></g>
<g fill="#2b7bb9"><circle cx="156" cy="217" r="10"/><circle cx="369" cy="221" r="10"/><circle cx="509" cy="270" r="10"/><circle cx="655" cy="474" r="10"/></g>
<g font-family="Arial, sans-serif" font-size="20" fill="#111"><text x="172" y="205">Open triage</text><text x="385" y="248">Hybrid</text><text x="525" y="258">Open publication</text><text x="671" y="466">Peer review</text></g>
<text x="525" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">False social harm realized (log scale)</text>
<text x="34" y="315" transform="rotate(-90 34 315)" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">True social value recovered</text>
</svg>
