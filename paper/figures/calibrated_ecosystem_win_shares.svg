<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:32px;font-weight:700}.axis{font-size:18px}.tick{font-size:15px;fill:#333}.value{font-size:20px;font-weight:700}.label{font-size:17px}.note{font-size:13px;fill:#333}</style>
<text x="600" y="52" text-anchor="middle" class="title">Win share after empirical reviewer calibration</text>
<line x1="115" y1="555.0" x2="1140" y2="555.0" stroke="#d9dde3" stroke-width="1"/>
<text x="98" y="560.0" text-anchor="end" class="tick">0%</text>
<line x1="115" y1="465.0" x2="1140" y2="465.0" stroke="#d9dde3" stroke-width="1"/>
<text x="98" y="470.0" text-anchor="end" class="tick">20%</text>
<line x1="115" y1="375.0" x2="1140" y2="375.0" stroke="#d9dde3" stroke-width="1"/>
<text x="98" y="380.0" text-anchor="end" class="tick">40%</text>
<line x1="115" y1="285.0" x2="1140" y2="285.0" stroke="#d9dde3" stroke-width="1"/>
<text x="98" y="290.0" text-anchor="end" class="tick">60%</text>
<line x1="115" y1="195.0" x2="1140" y2="195.0" stroke="#d9dde3" stroke-width="1"/>
<text x="98" y="200.0" text-anchor="end" class="tick">80%</text>
<line x1="115" y1="105.0" x2="1140" y2="105.0" stroke="#d9dde3" stroke-width="1"/>
<text x="98" y="110.0" text-anchor="end" class="tick">100%</text>
<line x1="115" y1="105" x2="115" y2="555" stroke="#222" stroke-width="2"/>
<line x1="115" y1="555" x2="1140" y2="555" stroke="#222" stroke-width="2"/>
<text x="28" y="330" transform="rotate(-90 28 330)" text-anchor="middle" class="axis">Share of simulated worlds won</text>
<rect x="155" y="331.8" width="170" height="223.2" fill="#2F6BFF"/>
<text x="240.0" y="317.8" text-anchor="middle" class="value">49.6%</text>
<text x="240.0" y="590" text-anchor="middle" class="label">Open triage</text>
<rect x="410" y="420.0" width="170" height="135.0" fill="#7898E8"/>
<text x="495.0" y="406.0" text-anchor="middle" class="value">30.0%</text>
<text x="495.0" y="590" text-anchor="middle" class="label">Hybrid</text>
<rect x="665" y="484.8" width="170" height="70.2" fill="#B8BEC8"/>
<text x="750.0" y="470.8" text-anchor="middle" class="value">15.6%</text>
<text x="750.0" y="590" text-anchor="middle" class="label">Open publication</text>
<rect x="920" y="533.4" width="170" height="21.6" fill="#4D5562"/>
<text x="1005.0" y="519.4" text-anchor="middle" class="value">4.8%</text>
<text x="1005.0" y="590" text-anchor="middle" class="label">Peer review</text>
<text x="600" y="644" text-anchor="middle" class="note">Reviewer behavior calibrated to controlled studies; 500 worlds and 125,000 simulated papers.</text>
<text x="600" y="666" text-anchor="middle" class="note">Post-rejection attention, resubmission, evidence dynamics, and utility weights remain structural sweeps.</text>
</svg>
