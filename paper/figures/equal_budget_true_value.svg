<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Equal-total-labor true value recovery</title>
<desc id="desc">Open triage recovered 90.4 percent of true value, peer review 88.5 percent, hybrid 88.5 percent, and open review 85.8 percent.</desc>
<rect width="1000" height="620" fill="white"/>
<text x="500" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">Equal-total-labor stress test</text>
<line x1="105" y1="520" x2="950" y2="520" stroke="#333" stroke-width="2"/>
<line x1="105" y1="90" x2="105" y2="520" stroke="#333" stroke-width="2"/>
<g font-family="Arial, sans-serif" font-size="18" fill="#333">
<text x="92" y="526" text-anchor="end">0%</text><text x="92" y="440" text-anchor="end">20%</text><text x="92" y="354" text-anchor="end">40%</text><text x="92" y="268" text-anchor="end">60%</text><text x="92" y="182" text-anchor="end">80%</text><text x="92" y="96" text-anchor="end">100%</text>
</g>
<g stroke="#ddd"><line x1="105" y1="434" x2="950" y2="434"/><line x1="105" y1="348" x2="950" y2="348"/><line x1="105" y1="262" x2="950" y2="262"/><line x1="105" y1="176" x2="950" y2="176"/><line x1="105" y1="90" x2="950" y2="90"/></g>
<g fill="#2b7bb9">
<rect x="145" y="131" width="150" height="389"/><rect x="350" y="139" width="150" height="381"/><rect x="555" y="140" width="150" height="380"/><rect x="760" y="151" width="150" height="369"/>
</g>
<g font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#111">
<text x="220" y="116">90.4%</text><text x="425" y="124">88.5%</text><text x="630" y="125">88.5%</text><text x="835" y="136">85.8%</text>
</g>
<g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#222">
<text x="220" y="558">Open triage</text><text x="425" y="558">Peer review</text><text x="630" y="558">Hybrid</text><text x="835" y="558">Open review</text>
</g>
<text x="30" y="310" transform="rotate(-90 30 310)" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">True scientific value recovered</text>
</svg>
