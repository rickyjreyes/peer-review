<line x1="115" y1="105" x2="115" y2="555" stroke="#222" stroke-width="2"/>
<line x1="115" y1="555" x2="1140" y2="555" stroke="#222" stroke-width="2"/>
<text x="28" y="330" transform="rotate(-90 28 330)" text-anchor="middle" class="axis">True scientific value recovered</text>
<rect x="155" y="177.3" width="170" height="377.7" fill="#2F6BFF"/>
<text x="240.0" y="163.3" text-anchor="middle" class="value">83.9%</text>
<text x="240.0" y="590" text-anchor="middle" class="label">Open triage</text>
<rect x="410" y="181.5" width="170" height="373.5" fill="#7898E8"/>
<text x="495.0" y="167.5" text-anchor="middle" class="value">83.0%</text>
<text x="495.0" y="590" text-anchor="middle" class="label">Hybrid</text>
<rect x="665" y="200.7" width="170" height="354.3" fill="#B8BEC8"/>
