<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:32px;font-weight:700}.axis{font-size:18px}.tick{font-size:15px;fill:#333}.value{font-size:20px;font-weight:700}.label{font-size:17px}.note{font-size:13px;fill:#333}</style>
<text x="600" y="52" text-anchor="middle" class="title">Truth recovery after empirical reviewer calibration</text>
<line x1="115" y1="555.0" x2="1140" y2="555.0" stroke="#d9dde3" stroke-width="1"/>
<text x="98" y="560.0" text-anchor="end" class="tick">0%</text>
